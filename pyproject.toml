[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silicon-sort"
version = "0.1.0"
description = "Chunked spike sorter for low-channel brainstem silicon probes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6", "pyqtgraph>=0.13"]
cuda = ["cupy-cuda12x>=13.0"]
dev = ["pytest>=8.0"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
silicon-sort = "silicon_sort.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silicon_sort = ["gui/assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "realdata: optional test against a real recording on disk",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
